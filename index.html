<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbitwright</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="view"></main>
    <aside class="panel" id="panel">
      <h1>Orbitwright</h1>
      <p class="subtitle">Prototype sandbox</p>
      <h2>Build</h2>
      <div id="palette" class="palette"></div>
      <h2>Tools</h2>
      <div class="tools">
        <button type="button" id="rotate" title="Rotate (R)">Rotate <kbd>R</kbd></button>
        <button type="button" id="remove" title="Remove (X)">Remove <kbd>X</kbd></button>
        <button type="button" id="undo" title="Undo (Ctrl+Z)">Undo <kbd>Ctrl Z</kbd></button>
      </div>
      <p class="help">Click to place. Right-drag or arrow keys to pan. Esc to stop building.</p>
    </aside>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
